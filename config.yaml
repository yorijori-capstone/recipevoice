embedding:
  provider: local
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
faiss:
  index_type: flat_ip
  top_k: 8
  score_threshold: 0.7
kakao_api:
  rest_api_key: ${KAKAO_REST_API_KEY}
  search_limit: 5
paths:
  raw_data_dir: ./data/storage/raw_data
  preprocessed_dir: ./data/storage/preprocessed_data
  faiss_index_path: ./data/storage/vectorstore/chunks.index
database:
  engine: postgres
  host: 127.0.0.1
  port: 5432
  name: yorijoridb
  user: insight
  password: insight
  options: {}
