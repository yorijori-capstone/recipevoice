  preprocessed_dir: ./data/storage/preprocessed_data
  faiss_index_path: ./data/storage/vectorstore/chunks.index
database:
  engine: postgres
  host: 127.0.0.1
  port: 5432
  name: recipevoice
  user: recipevoice
  password: recipevoice
  options: {}
