[tool.poetry]
name = "recipevoice"
version = "0.1.0"
description = "실시간 대화 처리를 통한 MCP 기반 요리 어시스턴트 웹앱 개발 프로젝트"
authors = ["팀 YoriJori <yorijori-capstone@gmail.com>"]
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "voice" },
    { include = "data" },
    { include = "rag" },
    { include = "llm" }
]

[tool.poetry.dependencies]
python = "~3.10"
django = "^4.2"
djangorestframework = "^3.15.1"
requests = "^2.31.0"
psycopg2-binary = "^2.9"
numpy = "^1.26"
pandas = "^2.1"
langchain = "^0.1"
openai = "^1.9"
faiss-cpu = "^1.7"
torch = "^2.2"
transformers = "^4.36"
google-cloud-speech = "^2.25"
boto3 = "^1.34"
google-cloud-texttospeech = "^2.31.0"
pydub = "^0.25.1"
sounddevice = "^0.5.2"
soundfile = "^0.13.1"
python-dotenv = "^1.0.0"
google-generativeai = "^0.5.4"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^24.3"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"