# ==========================================
# 📦 Poetry 프로젝트 설정 (RecipeVoice)
# ==========================================
[tool.poetry]
name = "recipevoice"
version = "0.1.0"
description = "실시간 대화 처리를 통한 MCP 기반 요리 어시스턴트 웹앱 개발 프로젝트"
authors = ["팀 YoriJori <yorijori-capstone@gmail.com>"]
readme = "README.md"

# 프로젝트 내 포함할 패키지 디렉터리들
packages = [
    { include = "dbserver" },
    { include = "voice" },
    { include = "data" },
    { include = "rag" },
    { include = "llm" }
]

# ==========================================
# 🧩 프로젝트 의존성 (Dependencies)
# ==========================================
[tool.poetry.dependencies]
# Python 버전 명시 (팀 환경: 3.10 기준)
python = "^3.10"

# ---- FastAPI 웹 프레임워크 관련 ----
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.2.0"

# ---- HTTP 요청 및 API 통신 ----
requests = "^2.31.0"

# ---- 데이터 처리 및 연산 ----
numpy = "^1.26"
pandas = "^2.1"

# ---- LLM 및 LangChain 연동 ----
langchain = "^0.3.0"
langchain-core = "^0.2"
langchain-google-genai = "^1.0.6"
openai = "^1.9"

# ---- 임베딩 및 벡터 검색 ----
faiss-cpu = "^1.7"
sentence-transformers = "^2.7"

# ---- 딥러닝 / 모델 구동 ----
torch = "^2.2"
transformers = "^4.36"

# ---- 음성 인식/합성 ----
google-cloud-speech = "^2.25"
google-cloud-texttospeech = "^2.31.0"
pydub = "^0.25.1"
sounddevice = "^0.5.2"
soundfile = "^0.13.1"
speechrecognition = "^3.10.4"
gtts = "^2.5.1"
pygame = "^2.6.0"
pyaudio = "^0.2.14"

# ---- 클라우드 및 환경 변수 관리 ----
boto3 = "^1.34"
python-dotenv = "^1.0.0"
google-generativeai = "^0.5.4"

# ---- 서버 및 실행 환경 ----
pyyaml = "^6.0.1"

# ==========================================
# 🧪 개발용 의존성 (Dev Dependencies)
# ==========================================
[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^24.3"
flake8 = "^7.0"
ipykernel = "^6.29"
jupyter = "^1.0"

# ==========================================
# ⚙️ 빌드 시스템 설정
# ==========================================
[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"
