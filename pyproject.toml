[tool.poetry]
name = "recipevoice"
version = "1.0.0"
description = "Recipe Voice Assistant - Full Stack Application with RAG Search"
authors = ["RecipeVoice Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
mcp = "^1.0.0"
psycopg = {extras = ["binary"], version = "^3.1.0"}
sentence-transformers = "^2.2.0"
faiss-cpu = "^1.7.4"
numpy = "^1.24.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

